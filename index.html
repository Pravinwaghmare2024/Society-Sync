<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SocietySync | Enterprise ERP</title>
    
    <base href="./" />

    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <script>
      window.process = { 
        env: { 
          API_KEY: "", 
          NODE_ENV: "production"
        } 
      };
      
      window.onerror = function(msg, url, line, col, error) {
        console.error("System Boot Error:", {msg, url, line, error});
        const root = document.getElementById('root');
        if (root) {
          root.innerHTML = `
            <div style="padding:60px; font-family:'Inter', sans-serif; display:flex; align-items:center; justify-content:center; min-height:100vh; background:#f8fafc;">
              <div style="max-width:500px; background:white; padding:40px; border-radius:32px; box-shadow:0 25px 50px -12px rgba(0,0,0,0.1); border:1px solid #f1f5f9;">
                <div style="width:60px; height:60px; background:#fee2e2; border-radius:20px; display:flex; align-items:center; justify-content:center; font-size:30px; margin-bottom:24px;">⚠️</div>
                <h2 style="font-weight:900; font-size:24px; color:#0f172a; margin-bottom:8px;">System Boot Failure</h2>
                <p style="color:#64748b; font-size:14px; line-height:1.6; margin-bottom:24px;">
                  The application failed to initialize.<br><br>
                  <strong>Troubleshooting:</strong><br>
                  1. Ensure you are using a modern browser.<br>
                  2. If using IIS, verify MIME types for .tsx are set to application/javascript.<br>
                  3. Check internet connection for CDN libraries.
                </p>
                <div id="error-log" style="background:#f8fafc; padding:16px; border-radius:12px; font-family:monospace; font-size:11px; color:#ef4444; overflow-x:auto; white-space:pre-wrap;"></div>
                <button onclick="location.reload()" style="margin-top:32px; width:100%; background:#4f46e5; color:white; border:none; padding:16px; border-radius:16px; font-weight:800; cursor:pointer;">Retry Boot Sequence</button>
              </div>
            </div>`;
          document.getElementById('error-log').textContent = msg + (line ? " at line " + line : "");
        }
        return false;
      };
    </script>

    <script type="importmap">
{
  "imports": {
    "@google/genai": "https://esm.sh/@google/genai@1.37.0",
    "react": "https://esm.sh/react@19.0.0",
    "react-dom": "https://esm.sh/react-dom@19.0.0",
    "react-dom/client": "https://esm.sh/react-dom@19.0.0/client",
    "recharts": "https://esm.sh/recharts@2.15.0?deps=react@19.0.0,react-dom@19.0.0",
    "react/": "https://esm.sh/react@^19.2.4/",
    "react-dom/": "https://esm.sh/react-dom@^19.2.4/"
  }
}
</script>
    
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; margin: 0; overflow: hidden; }
        #root { height: 100vh; }
        .boot-screen { height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #f8fafc; }
        .spinner { width: 40px; height: 40px; border: 4px solid #e2e8f0; border-top-color: #4f46e5; border-radius: 50%; animation: spin 0.8s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.26.2/babel.min.js"></script>
</head>
<body>
    <div id="root">
        <div class="boot-screen">
            <div class="spinner"></div>
            <p style="margin-top:20px; color:#64748b; font-weight:700; font-size:12px; letter-spacing:0.1em; text-transform:uppercase;">Secure Boot Initializing...</p>
        </div>
    </div>
    
    <!-- Monolithic entry point to prevent module resolution errors in local/IIS environments -->
    <script type="text/babel" data-presets="react,typescript" data-type="module" src="App.tsx"></script>
</body>
</html>
