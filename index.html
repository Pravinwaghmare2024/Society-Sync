<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SocietySync | Desktop Portal</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <script>
      // Injection of environment variables for the desktop app
      window.process = { env: { API_KEY: "" } };
      
      // Error logging helper for debugging packaged builds
      window.onerror = function(msg, url, line, col, error) {
        const root = document.getElementById('root');
        if (root) {
          root.innerHTML = `<div style="padding:40px; color:#e11d48; font-family:sans-serif; background:#fff1f2; min-height:100vh;">
            <h2 style="font-weight:900; font-size:24px;">App Boot Error</h2>
            <p style="font-weight:600;">${msg}</p>
            <div style="margin-top:20px; font-family:monospace; font-size:12px; opacity:0.7;">
              URL: ${url}<br>
              Line: ${line} | Column: ${col}
            </div>
            <button onclick="location.reload()" style="margin-top:30px; background:#e11d48; color:white; border:none; padding:12px 24px; border-radius:12px; font-weight:bold; cursor:pointer;">Retry App</button>
          </div>`;
        }
        return false;
      };
    </script>

    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; margin: 0; overflow: hidden; }
        #root { height: 100vh; }
        .boot-screen { height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #f8fafc; }
        .spinner { width: 40px; height: 40px; border: 4px solid #e2e8f0; border-top-color: #4f46e5; border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>

    <script type="importmap">
{
  "imports": {
    "@google/genai": "https://esm.sh/@google/genai@1.37.0",
    "react": "https://esm.sh/react@19.0.0",
    "react-dom": "https://esm.sh/react-dom@19.0.0",
    "react-dom/client": "https://esm.sh/react-dom@19.0.0/client",
    "recharts": "https://esm.sh/recharts@2.15.0?deps=react@19.0.0,react-dom@19.0.0",
    "react-dom/": "https://esm.sh/react-dom@^19.2.4/",
    "react/": "https://esm.sh/react@^19.2.4/"
  }
}
</script>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.26.2/babel.min.js"></script>
</head>
<body>
    <div id="root">
        <div class="boot-screen">
            <div class="spinner"></div>
            <p style="margin-top: 20px; color: #64748b; font-weight: 600;">Initializing SocietySync...</p>
        </div>
    </div>
    <!-- 
      CRITICAL FIX: Added data-presets="react,typescript" to handle TSX files.
      Babel-standalone needs to be told explicitly to use the typescript transformer.
    -->
    <script type="text/babel" data-presets="react,typescript" data-type="module" src="index.tsx"></script>
</body>
</html>
